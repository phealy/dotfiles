# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palettes:
    list:
        default:
            defaultBackground: '#2f2f2f'
            fillerColor: '#2f2f2f'
            splitForeground: '#808080'
    template: default
maps:
    host_name:
        wsl: devbox
        WIN-BPPB9PI3HUS: wsl
        CPC-pahea-Z0LC0: devbox
upgrade:
    source: cdn
    interval: 168h
    auto: false
    notice: true
console_title_template: '{{ .Shell }} in {{ .Folder }}'
final_space: true
blocks:
    - type: prompt
      alignment: left
      leading_diamond: 
      trailing_diamond: 
      segments:
        - leading_diamond: 
          template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} '
          foreground: '#d7af87'
          background: p:defaultBackground
          type: session
          style: diamond
        - properties:
            mixed_threshold: 3
            style: mixed
          leading_diamond: <p:splitForeground,parentBackground></>
          template: ' {{ if .Segments.Git.Dir }}{{ .Segments.Git.RepoName }}{{ if .Segments.Git.IsWorkTree }}(worktree){{ end }}:/{{ .Segments.Git.RelativeDir }}{{ else }}{{ .Path }}{{ end }} '
            #template: ' {{ if .Segments.Git.Dir }}{{ "\uf1d2" }} {{ .Segments.Git.RepoName }}{{ trimPrefix .Segments.Git.Dir (print "~" (trimPrefix .Env.HOME (trimPrefix "//wsl.localhost/Ubuntu-22.04" .Location))) }}{{ else }}{{ .Path }}{{ end }} '
          foreground: '#0087af'
          background: p:defaultBackground
          type: path
          style: diamond
        - properties:
            #branch_icon: ' '
            fetch_status: true
            fetch_upstream_icon: true
            untracked_modes:
                /home/pahealy/dev/vs-ssh.visualstudio.com/msazure/CloudNativeCompute/aks-rp: "no"
            #upstream_icons:
            #    aks-rp: 
          leading_diamond: <p:splitForeground,parentBackground></>
          template: ' {{ if .UpstreamIcon }}{{ .UpstreamIcon }}{{ else }}{{ "\uf1d2" }}{{ end }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
          foreground: '#dddddd'
          background: p:defaultBackground
          type: git
          style: diamond
          foreground_templates:
            - '{{ if or (.Working.Changed) (.Staging.Changed) }}#FF9248{{ end }}'
            - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ff4500{{ end }}'
            - '{{ if gt .Ahead 0 }}#B388FF{{ end }}'
            - '{{ if gt .Behind 0 }}#B388FF{{ end }}'
    - type: prompt
      alignment: right
      filler: <p:fillerColor,>─</>
      overflow: hide
      leading_diamond: 
      trailing_diamond: 
      segments:
        - leading_diamond: <p:splitForeground,defaultBackground></>
          template: ' {{ if gt .Code 0 }} {{ reason .Code }}({{ .Code }}){{ else }}{{ end }} '
          foreground: '#ffffff'
          background: p:defaultBackground
          type: status
          style: diamond
          foreground_templates:
            - '{{ if gt .Code 0 }}#f1184c{{ end }}'
            - p:defaultForeground
        - leading_diamond: <p:splitForeground,defaultBackground></>
          foreground: white
          background: p:defaultBackground
          type: executiontime
          style: diamond
        - leading_diamond: <p:splitForeground,parentBackground></>
          template: ' 󰠅 {{ if eq .Name "AKS Long Running Things" }}AKS LRT{{ else if eq .Name "Azure Container Service - Test (AKS Standalone)" }}AKS Test 8eca{{ else if eq .Name "AKS Underlay tmedev - canadacentral" }}AKSU TME CC{{ else if eq .Name "Azure VMware Solution (Service) - Stage-EastUS2-P03 (BL22-P03)"}}AVS{{ else }}{{ .Name }}{{ end }}{{ $config := "" }}{{ $rg := "" }}{{ if ne .Env.AZURE_CONFIG_DIR "" }}{{ $config = print (.Env.AZURE_CONFIG_DIR) "/config" }}{{ else }}{{ $config = print (.Env.HOME) "/.azure/config" }}{{ end }}{{ $rg = (split " = " (regexFind "group = (.*)" (readFile $config)))._1 }}{{ if $rg }}{{ print "/" $rg }}{{ end }} '
          foreground: '#0087d7'
          background: p:defaultBackground
          type: az
          style: diamond
        - properties:
            fetch_status: true
          leading_diamond: <p:splitForeground,defaultBackground></>
          template: ' ⎈ {{ trimSuffix "-admin" .Context}}{{if .Namespace}}/{{.Namespace}}{{else}}/default{{end}} '
          foreground: '#87ff00'
          background: p:defaultBackground
          type: kubectl
          style: diamond
          foreground_templates:
            - '{{ if hasSuffix "-system" .Namespace }}#ff0000{{ end }}'
            - '{{ if or (hasPrefix "kube-" .Namespace) (eq .Namespace "default") }}#af5fd7{{ end }}'
        - leading_diamond: <p:splitForeground,defaultBackground></>
          template: '  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
          foreground: white
          background: p:defaultBackground
          type: python
          style: diamond
    - type: prompt
      alignment: left
      segments:
        - template: ❯
          type: text
          style: plain
          foreground_templates:
            - '{{ if eq .Code 0 }}#00ff00{{ else }}#ff0000{{ end }}'
      newline: true
version: 3
