[tool_alias]
go = "http:ms-go"

[tools]
go = { version = "latest", version_list_url = "https://api.github.com/repos/microsoft/go/releases?per_page=100", version_json_path = ".[].tag_name", version_order = "semver", url = "https://aka.ms/golang/release/latest/go{{version}}.linux-amd64.tar.gz", checksum_url = "https://aka.ms/golang/release/latest/go{{version}}.linux-amd64.tar.gz.sha256", strip_components = "1", bin_path = "bin" }
"aqua:kubevirt/kubevirt/virtctl" = "latest"
"github:Azure/AKSFlexNode" = "latest"
"github:Azure/unbounded" = { version = "latest", matching = "kubectl-unbounded" }
"github:benjajaja/mdfried" = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
"go:github.com/phealy/git-credential-azure-cli" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"krew:aks" = "latest"
"krew:apidocs" = "latest"
"krew:ctx" = "latest"
"krew:edit-secret" = "latest"
"krew:node-shell" = "latest"
"krew:ns" = "latest"
"krew:retina" = "latest"
"krew:sniff" = "latest"
"krew:tree" = "latest"
"krew:virt" = "latest"
argocd = "latest"
azure = { version = "latest", uvx_args = "--prerelease=allow" }
azure-kubelogin = "latest"
bat = "latest"
cargo-binstall = "latest"
copilot-cli = "latest"
direnv = "latest"
fzf = "latest"
github-cli = "latest"
helm = "latest"
hugo = "latest"
jq = "latest"
k9s = "latest"
kubecolor = "latest"
kubectl = "latest"
node = "latest"
notation = "latest"
oh-my-posh = "latest"
oras = "latest"
powershell-core = "latest"
python = "latest"
ripgrep = "latest"
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
stern = "latest"
tmux = "latest"
uv = "latest"
websocat = "latest"
yq = "latest"
"go:sigs.k8s.io/yaml/yamlfmt" = "latest"
"github:microsoft/tgrep" = "latest"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.12"
"github:gastownhall/beads" = "latest"
"github:/microsoft/go" = "latest"

[settings]
minimum_release_age = "0"

[plugins]
krew = "https://github.com/soupglasses/mise-krew"

